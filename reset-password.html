<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculation Booster — Password Reset</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#111827;--muted:#64748b;--line:#e2e8f0;--p:#4f46e5;--p2:#7c3aed;--good:#16a34a;--bad:#dc2626;--soft:#eef2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.card{width:min(100%,430px);background:var(--card);border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:0 18px 60px rgba(15,23,42,.12)}.logo{width:58px;height:58px;margin:0 auto 10px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:28px}.brand{text-align:center}.brand h1{font-size:23px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:5px 0 18px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:850;color:var(--muted);margin:0 0 6px 2px}input{width:100%;height:48px;border:2px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);padding:0 12px;font:inherit;outline:0}input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f11c}.password-wrap{position:relative}.password-wrap input{padding-right:50px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.btn{width:100%;min-height:47px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin-top:9px}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.status{font-size:12px;line-height:1.5;text-align:center;margin-top:10px;color:var(--muted)}.ok{color:var(--good)}.err{color:var(--bad)}.note{font-size:10px;color:var(--muted);line-height:1.5;text-align:center;margin-top:13px}.back{text-align:center;margin-top:14px}.back a{font-size:11px;color:var(--p);font-weight:850;text-decoration:none}.hidden{display:none!important}body.dark{--bg:#0b1020;--card:#111827;--text:#f8fafc;--muted:#aeb9cc;--line:#29364d;--soft:#172033}.theme-toggle{position:fixed;top:14px;right:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}
</style></head>
<body>
<button class="theme-toggle" id="themeToggle" type="button">🌙 Dark Mode</button>
<div class="card"><div class="logo">🔑</div><div class="brand"><h1>Reset Password</h1><p id="intro">Enter your account email to receive a secure password reset link.</p></div>
<div id="requestBox"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="Your account email"></div><button class="btn primary" id="sendBtn">Send Reset Link</button></div>
<div id="changeBox" class="hidden"><div class="field"><label>New Password</label><div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" placeholder="New password"><button class="password-toggle" type="button" data-toggle="newPassword">👁️</button></div></div><div class="field"><label>Confirm New Password</label><div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat new password"><button class="password-toggle" type="button" data-toggle="confirmPassword">👁️</button></div></div><button class="btn primary" id="updateBtn">Update Password</button></div>
<div class="status" id="status"></div><div class="note">If you requested a reset, open the link sent to your email. Your password is handled by Supabase Auth; this page never stores it.</div><div class="back"><a href="/login.html">← Back to Login</a></div></div>
<script>
const SUPABASE_URL='https://akmnecnvbcyjaforsijz.supabase.co';const SUPABASE_KEY='sb_publishable_p92ofrykqrrEx96BGB61Zw_BqsuDPHg';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);
function status(t,c){$('status').textContent=t;$('status').className='status '+(c||'')}
function showChange(){ $('requestBox').classList.add('hidden');$('changeBox').classList.remove('hidden');$('intro').textContent='Choose a new password for your account.'; }
$('sendBtn').onclick=async()=>{const email=$('email').value.trim();if(!email){status('Enter your email address.','err');return}status('Sending reset link…');const redirectTo=location.origin+'/reset-password.html';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error){status('Could not send reset link: '+error.message,'err');return}status('If an account uses this email, a reset link has been sent. Check your inbox.','ok')};
$('updateBtn').onclick=async()=>{const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<8){status('Use at least 8 characters for a stronger password.','err');return}if(a!==b){status('Passwords do not match.','err');return}status('Updating password…');const {error}=await sb.auth.updateUser({password:a});if(error){status('Password update failed: '+error.message,'err');return}status('Password changed successfully. You can now login.','ok');setTimeout(()=>location.href='/login.html',900)};
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.toggle);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈'});
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(showChange,0)});sb.auth.getSession().then(({data})=>{if(location.hash&&/access_token|refresh_token|type=recovery/.test(location.hash))showChange();});
$('themeToggle').onclick=()=>{document.body.classList.toggle('dark');$('themeToggle').textContent=document.body.classList.contains('dark')?'☀️ Light Mode':'🌙 Dark Mode'};
</script></body></html>
